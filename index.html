<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARVEX | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: #f5f5f5;
    font-family: Tahoma, Arial;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #b99548;
    border-radius: 16px;
    padding: 22px;
}

h1 {
    color: #d6b45c;
    text-align: center;
    letter-spacing: 3px;
}

h3, h4 {
    color: #d6b45c;
}

p {
    text-align: center;
    color: #aaa;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 9px;
    font-size: 15px;
}

input {
    background: #111;
    border: 1px solid #555;
    color: white;
}

button {
    background: #c5a34c;
    border: 0;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: 0.8;
}

#panel {
    display: none;
}

.plan {
    border: 1px solid #b99548;
    padding: 13px;
    margin-top: 12px;
    border-radius: 9px;
    background: #151515;
    overflow-wrap: anywhere;
}

#message {
    text-align: center;
    margin-top: 15px;
    color: #e2c46b;
    overflow-wrap: anywhere;
}

.section {
    margin-top: 25px;
    border-top: 1px solid #444;
    padding-top: 15px;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>STARVEX</h1>
<p>PREMIUM VPN MANAGEMENT</p>

<!-- ورود مدیر -->

<div id="login">

<h3>ورود مدیر</h3>

<input
id="email"
type="email"
placeholder="ایمیل مدیر"
>

<input
id="password"
type="password"
placeholder="رمز عبور"
>

<button type="button" id="loginBtn">
ورود به پنل
</button>

</div>

<!-- پنل مدیریت -->

<div id="panel">

<h3>خوش آمدید مدیر STARVEX</h3>

<p>پنل مدیریت با موفقیت فعال شد.</p>

<!-- پلن ها -->

<div class="section">

<h3>مدیریت پلن‌ها</h3>

<button type="button" id="plansBtn">
نمایش پلن‌ها
</button>

<div id="plans"></div>

</div>

<!-- مشتریان -->

<div class="section">

<h3>مدیریت مشتریان STARVEX</h3>

<button type="button" id="customersBtn">
مشاهده مشتریان
</button>

<button type="button" id="addCustomerBtn">
ثبت مشتری جدید
</button>

<div id="customerForm"></div>

<div id="customers"></div>

</div>

<button type="button" id="logoutBtn">
خروج از حساب
</button>

</div>

<div id="message"></div>

</div>
</div>

<script>

// تنظیمات Supabase

const SUPABASE_URL =
"https://hbjonoxlasbhbusctmom.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mooK4G0-1pnpckPue4T1PA_NVsydkl6";

const ADMIN_EMAIL =
"mahazporjozy@gmail.com";

const message = document.getElementById("message");

// بررسی کتابخانه

if (!window.supabase) {

    message.textContent =
    "خطا: کتابخانه Supabase بارگذاری نشده است.";

    throw new Error("Supabase library not loaded");
}

// اتصال دیتابیس

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// نمایش پیام

function showMessage(text) {
    message.textContent = text;
}


// ایمن سازی متن

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, function(c) {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c];

    });

}


// ورود مدیر

async function login() {

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    showMessage("در حال ورود...");

    if (
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        showMessage("اجازه ورود ندارید.");
        return;

    }

    if (!password) {

        showMessage("رمز عبور را وارد کنید.");
        return;

    }

    try {

        const { data, error } =
        await db.auth.signInWithPassword({
            email,
            password
        });

        if (error) {

            showMessage("خطا در ورود: " + error.message);
            return;

        }

        if (data.user.app_metadata?.role !== "admin") {

            await db.auth.signOut();

            showMessage("این حساب دسترسی مدیر ندارد.");
            return;

        }

        showPanel();

    } catch (error) {

        showMessage("خطا: " + error.message);

    }

}


// نمایش پنل

function showPanel() {

    document.getElementById("login").style.display = "none";

    document.getElementById("panel").style.display = "block";

    showMessage("ورود موفقیت‌آمیز بود.");

}


// نمایش پلن ها

async function loadPlans() {

    const box = document.getElementById("plans");

    box.textContent = "در حال دریافت پلن‌ها...";

    try {

        const { data, error } = await db
            .from("plans")
            .select("id,name,duration_days,volume_gb")
            .order("id");

        if (error) {

            box.textContent = "خطا: " + error.message;
            return;

        }

        if (!data || data.length === 0) {

            box.textContent = "هنوز پلنی ثبت نشده است.";
            return;

        }

        box.innerHTML = data.map(p => `

            <div class="plan">

                <strong>${escapeHTML(p.name)}</strong>

                <br>

                مدت: ${Number(p.duration_days)} روز

                <br>

                حجم: ${Number(p.volume_gb)} گیگابایت

            </div>

        `).join("");

    } catch (error) {

        box.textContent = "خطا: " + error.message;

    }

}


// نمایش مشتریان

async function loadCustomers() {

    const box = document.getElementById("customers");

    box.textContent = "در حال دریافت مشتریان...";

    try {

        const { data, error } = await db
            .from("customers")
            .select("id,full_name,status,created_at")
            .order("id", { ascending: false });

        if (error) {

            box.textContent =
            "خطا در دریافت مشتریان: " + error.message;

            return;

        }

        if (!data || data.length === 0) {

            box.textContent = "هنوز مشتری ثبت نشده است.";
            return;

        }

        box.innerHTML = data.map(c => `

            <div class="plan">

                <strong>
                    ${escapeHTML(c.full_name || "بدون نام")}
                </strong>

                <br>

                شناسه: ${escapeHTML(c.id)}

                <br>

                وضعیت: ${escapeHTML(c.status || "-")}

                <br>

                تاریخ ثبت:
                ${escapeHTML(c.created_at || "-")}

            </div>

        `).join("");

    } catch (error) {

        box.textContent =
        "خطا: " + error.message;

    }

}


// نمایش فرم ثبت مشتری

function showAddCustomer() {

    const box =
    document.getElementById("customerForm");

    box.innerHTML = `

        <div class="plan">

            <h4>ثبت مشتری جدید</h4>

            <input
                id="newCustomerName"
                type="text"
                placeholder="نام کامل مشتری"
            >

            <button type="button" id="saveCustomerBtn">
                ثبت مشتری
            </button>

        </div>

    `;

    document
        .getElementById("saveCustomerBtn")
        .addEventListener("click", addCustomer);

}


// ثبت مشتری

async function addCustomer() {

    const input =
    document.getElementById("newCustomerName");

    const box =
    document.getElementById("customerForm");

    const name = input.value.trim();

    if (!name) {

        showMessage("نام مشتری را وارد کنید.");
        return;

    }

    showMessage("در حال ثبت مشتری...");

    try {

        const { error } = await db
            .from("customers")
            .insert({
                full_name: name,
                status: "active"
            });

        if (error) {

            showMessage("خطا در ثبت مشتری: " + error.message);
            return;

        }

        box.innerHTML =
        '<div class="plan">مشتری با موفقیت ثبت شد.</div>';

        showMessage("ثبت مشتری موفق بود.");

        await loadCustomers();

    } catch (error) {

        showMessage("خطا: " + error.message);

    }

}


// خروج

async function logout() {

    await db.auth.signOut();

    location.reload();

}


// بررسی نشست قبلی

async function checkSession() {

    try {

        const { data, error } =
        await db.auth.getSession();

        if (error || !data.session) {
            return;
        }

        const user = data.session.user;

        if (
            user.email?.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
            &&
            user.app_metadata?.role === "admin"
        ) {

            showPanel();

        } else {

            await db.auth.signOut();

        }

    } catch (error) {

        showMessage("خطا در بررسی حساب: " + error.message);

    }

}


// اتصال دکمه‌ها

document
    .getElementById("loginBtn")
    .addEventListener("click", login);

document
    .getElementById("plansBtn")
    .addEventListener("click", loadPlans);

document
    .getElementById("customersBtn")
    .addEventListener("click", loadCustomers);

document
    .getElementById("addCustomerBtn")
    .addEventListener("click", showAddCustomer);

document
    .getElementById("logoutBtn")
    .addEventListener("click", logout);


// شروع بررسی حساب

checkSession();

</script>

</body>
</html>
