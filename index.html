<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARVEX | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#101010;
color:#f5f5f5;
font-family:Tahoma,Arial;
}

.container{
max-width:460px;
margin:50px auto;
padding:20px;
}

.card{
background:#1b1b1b;
border:1px solid #b99548;
border-radius:16px;
padding:25px;
}

h1{
color:#d6b45c;
text-align:center;
letter-spacing:3px;
}

p{
text-align:center;
color:#aaa;
}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:9px;
font-size:15px;
}

input{
background:#111;
border:1px solid #555;
color:white;
}

button{
background:#c5a34c;
border:0;
color:#111;
font-weight:bold;
cursor:pointer;
}

#message{
text-align:center;
margin-top:15px;
color:#e2c46b;
}

#panel{display:none}

.plan{
border:1px solid #b99548;
padding:13px;
margin-top:12px;
border-radius:9px;
background:#151515;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>STARVEX</h1>
<p>PREMIUM VPN MANAGEMENT</p>

<div id="login">

<h3>ورود مدیر</h3>

<input id="email" type="email"
placeholder="ایمیل مدیر">

<input id="password" type="password"
placeholder="رمز عبور">

<button onclick="login()">ورود به پنل</button>

</div>

<div id="panel">

<h3>خوش آمدید مدیر STARVEX</h3>

<p>پنل مدیریت با موفقیت فعال شد.</p>

<button onclick="loadPlans()">
نمایش پلن‌ها
</button>

<div id="plans"></div>
<hr>

<h3>مدیریت مشتریان STARVEX</h3>

<button onclick="loadCustomers()">
مشاهده مشتریان
</button>

<button onclick="showAddCustomer()">
ثبت مشتری جدید
</button>

<div id="customerForm"></div>

<div id="customers"></div>

<button onclick="logout()">
خروج از حساب
</button>

</div>

<div id="message"></div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://hbjonoxlasbhbusctmom.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mooK4G0-1pnpckPue4T1PA_NVsydkl6";

const ADMIN_EMAIL =
"mahazporjozy@gmail.com";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("message");

msg.textContent="در حال ورود...";

if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
msg.textContent="اجازه ورود ندارید.";
return;
}

const {data,error}=await db.auth.signInWithPassword({
email,
password
});

if(error){
msg.textContent="خطا در ورود: "+error.message;
return;
}

const role =
data.user.app_metadata?.role;

if(role !== "admin"){
await db.auth.signOut();
msg.textContent="این حساب دسترسی مدیر ندارد.";
return;
}

showPanel();

}

function showPanel(){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

document.getElementById("message").textContent=
"ورود موفقیت‌آمیز بود.";

}

async function loadPlans(){

const box=document.getElementById("plans");

box.textContent="در حال دریافت پلن‌ها...";

const {data,error}=await db
.from("plans")
.select("id,name,duration_days,volume_gb")
.order("id");

if(error){
box.textContent="خطا: "+error.message;
return;
}

if(!data || data.length===0){
box.textContent="هنوز پلنی ثبت نشده است.";
return;
}

box.innerHTML=data.map(p=>`

<div class="plan">

<strong>${escapeHTML(p.name)}</strong>

<br>

مدت: ${Number(p.duration_days)} روز

<br>

حجم: ${Number(p.volume_gb)} گیگابایت

</div>

`).join("");

}

function escapeHTML(value){

return String(value).replace(/[&<>"']/g,function(c){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];
});

}

async function logout(){

await db.auth.signOut();

location.reload();

}

async function checkSession(){

const {data}=await db.auth.getSession();

if(!data.session)return;

const user=data.session.user;

if(
user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()
&& user.app_metadata?.role==="admin"
){

showPanel();

}else{

await db.auth.signOut();

}

}

db.auth.onAuthStateChange((event,session)=>{

if(event==="SIGNED_OUT"){
location.reload();
}

});

checkSession();

</script>

</body>
</html>
