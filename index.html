<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>STARVEX VPN | پنل اختصاصی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #080b14;
      color: #f5f7ff;
      line-height: 1.8;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid #20283a;
      background: #0b101d;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #d9b66d;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 11px;
      color: #9ba7c0;
      letter-spacing: 2px;
    }

    .badge {
      padding: 6px 12px;
      border: 1px solid #34415a;
      border-radius: 8px;
      color: #a9c5ff;
      font-size: 12px;
    }

    .hero {
      padding: 38px 0 24px;
    }

    .hero h1 {
      font-size: clamp(25px, 5vw, 38px);
      margin-bottom: 8px;
    }

    .hero h1 span {
      color: #d9b66d;
    }

    .hero p {
      color: #aab5ca;
      font-size: 14px;
    }

    .notice {
      margin-top: 22px;
      padding: 13px 16px;
      border: 1px solid #66532c;
      border-radius: 10px;
      background: #19170f;
      color: #e8cc8b;
      font-size: 12px;
    }

    .section-title {
      margin: 28px 0 15px;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: #101725;
      border: 1px solid #253047;
      border-radius: 13px;
      padding: 21px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .card p {
      margin: 0 0 17px;
      font-size: 13px;
      color: #aab5ca;
    }

    .icon {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .button {
      display: block;
      width: 100%;
      border: 1px solid #d9b66d;
      border-radius: 8px;
      padding: 11px 12px;
      background: #d9b66d;
      color: #10131b;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .button.blue {
      background: #172c50;
      color: #c7dcff;
      border-color: #355b94;
    }

    .button.outline {
      background: transparent;
      color: #e0c37e;
    }

    .server {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #253047;
    }

    .server:last-child {
      border-bottom: none;
    }

    .server-name {
      font-size: 14px;
      font-weight: bold;
    }

    .server-info {
      font-size: 11px;
      color: #9ba7c0;
    }

    .status {
      font-size: 11px;
      color: #e8
